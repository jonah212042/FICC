<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台幣貨幣市場基金 月度摘要 2026.06</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700;900&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --paper:#F3F5F2;
  --card:#FCFDFC;
  --ink:#1C2B26;
  --ink-soft:#4A5B54;
  --ink-faint:#8A968F;
  --line:#DDE4DF;
  --pine:#205C4C;
  --teal:#4E8F7D;
  --sage:#A9C6B9;
  --mist:#D7E3DC;
  --seal:#B2402A;
  --up:#B93A2B;   /* 台股慣例：紅漲 */
  --dn:#1E7F4F;   /* 綠跌 */
  --serif:"Noto Serif TC","PMingLiU",serif;
  --sans:"Noto Sans TC","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto} *{animation:none!important;transition:none!important}}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 28px 64px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- header ---------- */
header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:44px 0 26px;border-bottom:3px solid var(--ink)}
.eyebrow{font-size:12px;letter-spacing:.32em;color:var(--pine);font-weight:700;margin-bottom:10px}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(28px,4.4vw,44px);line-height:1.2;letter-spacing:.02em}
h1 small{display:block;font-size:15px;font-weight:600;color:var(--ink-soft);letter-spacing:.14em;margin-top:8px}
.seal{flex:none;width:86px;height:86px;border:3px solid var(--seal);color:var(--seal);border-radius:6px;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:19px;line-height:1.35;text-align:center;letter-spacing:.12em;transform:rotate(4deg);padding:6px;box-shadow:0 0 0 1px rgba(178,64,42,.25) inset;user-select:none}

/* ---------- hero ---------- */
.hero{display:grid;grid-template-columns:290px 1fr;gap:20px 36px;align-items:center;padding:28px 0 10px}
.hero .chips{grid-column:1/-1}
.hero-num .label{font-size:13px;letter-spacing:.22em;color:var(--ink-soft);font-weight:700}
.hero-num .big{font-family:var(--serif);font-weight:900;font-size:64px;line-height:1.05;margin:6px 0 2px}
.hero-num .big em{font-style:normal;font-size:22px;font-weight:700;color:var(--ink-soft);margin-left:6px}
.chips{display:flex;flex-wrap:nowrap;gap:10px;overflow-x:auto}
.chip{white-space:nowrap;flex:none}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:5px 13px;font-size:13px;color:var(--ink-soft)}
.chip b{font-family:var(--mono);font-weight:600;color:var(--ink);margin-left:5px}
.chip b.up{color:var(--up)} .chip b.dn{color:var(--dn)}
.chart-box{position:relative}
.chart-box svg{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;padding:7px 11px;border-radius:6px;opacity:0;transform:translate(-50%,-115%);white-space:nowrap;transition:opacity .12s}
.tip b{font-family:var(--mono);font-weight:600}

/* ---------- sections ---------- */
section{margin-top:52px}
section.fold .sec-head{cursor:pointer}
.chev{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink-soft);width:26px;height:26px;border-radius:6px;font-size:13px;line-height:1;cursor:pointer;transition:transform .25s ease;display:grid;place-items:center;align-self:center}
.chev:hover{border-color:var(--pine);color:var(--pine)}
.chev:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
section.closed .chev{transform:rotate(-90deg)}
.fold-body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s ease}
.fold-inner{min-width:0;overflow:hidden}
section.closed .fold-body{grid-template-rows:0fr}
.sec-head{display:flex;align-items:baseline;justify-content:flex-start;gap:14px;row-gap:6px;flex-wrap:wrap;border-bottom:1.5px solid var(--line);padding-bottom:10px;margin-bottom:22px}
.sec-head .chev{margin-left:auto}
h2{font-family:var(--serif);font-weight:700;font-size:22px;letter-spacing:.06em;white-space:nowrap}
h2::before{content:"";display:inline-block;width:10px;height:10px;background:var(--pine);margin-right:11px;transform:rotate(45deg) translateY(-2px)}
.sec-note{font-size:12.5px;color:var(--ink-faint)}

.rank-idx{font-family:var(--mono);font-size:12px;color:var(--ink-faint);text-align:right}
.rank-name{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes grow{from{transform:scaleX(0)}}
.rank-val{display:flex;justify-content:flex-end;align-items:baseline;gap:14px;font-size:13.5px}
.rank-val .v{font-family:var(--mono);font-weight:600;min-width:60px;text-align:right}
.rank-val .delta{min-width:64px;text-align:right}
.delta{font-family:var(--mono);font-size:12px}
.delta.up{color:var(--up)} .delta.dn{color:var(--dn)} .delta.na{color:var(--ink-faint)}

.co-row{display:grid;grid-template-columns:22px 204px 1fr 248px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.co-row:last-child{border-bottom:none}
.co-row.market{padding:10px 0 14px;margin-bottom:6px;border-bottom:1.5px solid var(--line)}
.co-row:not(.market){cursor:pointer}
.co-caret{display:inline-block;font-size:9px;color:var(--ink-faint);margin-left:7px;transition:transform .2s ease;transform:translateY(-1px)}
.co-row.open .co-caret{transform:rotate(90deg) translateX(-1px)}
.co-sub{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}
.co-sub.open{grid-template-rows:1fr}
.co-sub>div{overflow:hidden}
.co-sub-row{display:grid;grid-template-columns:22px 204px 1fr 248px;gap:12px;align-items:center;padding:4px 0}
.co-sub-row:first-child{padding-top:8px}
.co-sub-row:last-child{padding-bottom:10px}
.co-sub-name{font-size:12.5px;color:var(--ink-soft);padding-left:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co-sub-bar{height:10px;background:transparent;border-radius:2px;overflow:hidden}
.co-sub-bar i{display:block;height:100%;background:var(--sage);border-radius:2px}
.co-sub-val{display:flex;justify-content:flex-end;align-items:baseline;gap:14px;font-size:12.5px}
.co-sub-val .v{font-family:var(--mono);font-weight:500;min-width:66px;text-align:right}
.co-sub-val .delta{min-width:56px;text-align:right}
.co-sub-val .share{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);min-width:52px;text-align:right;visibility:hidden}
.co-row.market .co-name{font-weight:700}
.co-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co-name small{font-weight:400;color:var(--ink-faint);font-size:12px;margin-left:4px}
.co-bar{height:18px;background:var(--mist);border-radius:3px;overflow:hidden}
.co-bar i{display:block;height:100%;background:linear-gradient(90deg,#173F35,var(--pine) 60%,var(--teal));border-radius:3px;transform-origin:left;animation:grow .7s ease both}
.co-val{display:flex;justify-content:flex-end;align-items:baseline;gap:14px;font-size:13.5px}
.co-val .v{font-family:var(--mono);font-weight:600;min-width:66px;text-align:right}
.co-val .delta{min-width:56px;text-align:right}
.co-val .share{font-family:var(--mono);font-size:12px;color:var(--ink-faint);min-width:52px;text-align:right}
@media (max-width:860px){.co-row,.co-sub-row{grid-template-columns:20px 142px 1fr 86px}.co-val .share{min-width:0}.co-sub-val{flex-direction:column;align-items:flex-end;gap:1px}.co-sub-val .v,.co-sub-val .delta{min-width:0}.co-sub-val .share{display:none}}
.obs-card{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:24px 30px 20px}
.obs-card h3{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:.08em;color:var(--pine);margin:22px 0 8px;padding-left:12px;border-left:3px solid var(--pine)}
.obs-card h3:first-child{margin-top:0}
.obs-card p{font-size:14px;color:var(--ink-soft);text-align:justify;margin-bottom:12px}
.obs-card p:last-child{margin-bottom:0}
.obs-card p b{color:var(--ink)}
.obs-card ul{list-style:none;margin:2px 0 12px;padding:0}
.obs-card li{position:relative;padding:5px 0 5px 20px;font-size:14px;color:var(--ink-soft);text-align:justify}
.obs-card li::before{content:"";position:absolute;left:2px;top:13px;width:7px;height:7px;background:var(--pine);transform:rotate(45deg)}
.obs-card li b{color:var(--ink)}
.obs-card .num{font-weight:600}
.obs-card .up{color:var(--up)} .obs-card .dn{color:var(--dn)}

.mix-row{display:grid;grid-template-columns:22px 152px 1fr 152px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.mix-row:last-child{border-bottom:none}
.mix-row.market{padding:10px 0 14px;margin-bottom:6px;border-bottom:1.5px solid var(--line)}
.mix-row.market .rank-name{font-weight:700}
.mix-track{min-width:0}
.mix-bar{display:flex;height:20px;border-radius:3px;overflow:hidden;transform-origin:left;animation:grow .7s ease both}
.mix-bar span{height:100%;display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;color:#fff;overflow:hidden;white-space:nowrap}
.mix-bar span:nth-child(1){background:#205C4C}
.mix-bar span:nth-child(2){background:#3D6B99}
.mix-bar span:nth-child(3){background:#C8A24B;color:#3A3320}
.mix-bar span:nth-child(4){background:#C4C9C6;color:var(--ink)}
.mix-bar.empty{background:var(--mist)}

.legend{display:flex;gap:18px;font-size:12.5px;color:var(--ink-soft);flex-wrap:nowrap}
.legend span{white-space:nowrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;transform:translateY(1px)}


footer{margin-top:56px;padding-top:18px;border-top:3px solid var(--ink);display:flex;justify-content:space-between;gap:16px;font-size:12px;color:var(--ink-faint)}

@media (max-width:860px){
  .hero{grid-template-columns:1fr;gap:20px}
  .mix-row{grid-template-columns:20px 112px 1fr 78px;gap:8px}
  .mix-row.market .rank-name{font-size:13px}
  .mix-row .rank-val,.co-row .co-val{flex-direction:column;align-items:flex-end;gap:2px}
  .mix-row .rank-val .v,.co-row .co-val .v{min-width:0}
  .mix-row .rank-val .delta,.co-row .co-val .delta{min-width:0}
  .seal{width:68px;height:68px;font-size:15px}
}
</style>
</head>

/* ---- trend chart (SVG) ---- */
(function(){
  const svg = document.getElementById('trend');
  const W=700,H=240,pl=54,pr=14,pt=16,pb=30;
  const xs=D.months, ys=D.total_series;
  const ymin=Math.floor(Math.min(...ys)/500)*500-200;
  const ymax=Math.ceil(Math.max(...ys)/500)*500;
  const X=i=> pl+(W-pl-pr)*i/(xs.length-1);
  const Y=v=> pt+(H-pt-pb)*(1-(v-ymin)/(ymax-ymin));
  let g='';
  for(let v=Math.ceil(ymin/1000)*1000; v<=ymax; v+=1000){
    g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/>`
      +`<text x="${pl-9}" y="${Y(v)+4}" text-anchor="end" font-size="10.5" fill="var(--ink-faint)" font-family="IBM Plex Mono,monospace">${v.toLocaleString()}</text>`;
  }
  let path='', area=`M ${X(0)} ${Y(ys[0])}`;
  ys.forEach((v,i)=>{ path+= (i?'L':'M')+` ${X(i)} ${Y(v)} `; if(i) area+=` L ${X(i)} ${Y(v)}`; });
  area+=` L ${X(ys.length-1)} ${H-pb} L ${X(0)} ${H-pb} Z`;
  let lbls='';
  xs.forEach((m,i)=>{ if(i%3===0||i===xs.length-1){
    const last = i===xs.length-1;
    lbls+=`<text x="${last? X(i)+6 : X(i)}" y="${H-9}" text-anchor="${last?'end':'middle'}" font-size="10.5" fill="var(--ink-faint)" font-family="IBM Plex Mono,monospace">${mLabel(m)}</text>`;}});
  const last=ys.length-1;
  svg.innerHTML = `
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4E8F7D" stop-opacity=".35"/><stop offset="1" stop-color="#4E8F7D" stop-opacity=".03"/>
    </linearGradient></defs>
    ${g}
    <path d="${area}" fill="url(#ag)"/>
    <path d="${path}" fill="none" stroke="var(--pine)" stroke-width="2.5" stroke-linejoin="round"/>
    ${lbls}
    <line id="cursor" y1="${pt}" y2="${H-pb}" stroke="var(--ink)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>
    <circle id="dotHover" r="4.5" fill="var(--pine)" stroke="#fff" stroke-width="2" opacity="0"/>
    <circle cx="${X(last)}" cy="${Y(ys[last])}" r="4.5" fill="var(--seal)" stroke="#fff" stroke-width="2"/>
    <rect id="hit" x="${pl}" y="0" width="${W-pl-pr}" height="${H}" fill="transparent"/>`;
  const box=document.getElementById('trendBox'), tip=document.getElementById('trendTip');
  const cursor=svg.querySelector('#cursor'), dot=svg.querySelector('#dotHover');
  svg.querySelector('#hit').addEventListener('mousemove',e=>{
    const r=svg.getBoundingClientRect(), sx=W/r.width;
    const px=(e.clientX-r.left)*sx;
    const i=Math.max(0,Math.min(xs.length-1,Math.round((px-pl)/(W-pl-pr)*(xs.length-1))));
    cursor.setAttribute('x1',X(i)); cursor.setAttribute('x2',X(i)); cursor.setAttribute('opacity',1);
    dot.setAttribute('cx',X(i)); dot.setAttribute('cy',Y(ys[i])); dot.setAttribute('opacity',1);
    tip.style.opacity=1;
    tip.style.left=(X(i)/sx)+'px';
    tip.style.top=(Y(ys[i])/ (H/r.height))+'px';
    tip.innerHTML=`${mLabel(xs[i])} 總規模 <b>${fmt(ys[i],0)}</b> 億`;
  });
  svg.querySelector('#hit').addEventListener('mouseleave',()=>{
    cursor.setAttribute('opacity',0); dot.setAttribute('opacity',0); tip.style.opacity=0;
  });
})();

  html += top.map((f,i)=>`
    <div class="mix-row">
      <span class="rank-idx">${String(i+1).padStart(2,'0')}</span>
      <span class="rank-name" title="${f.name}">${f.name}</span>
      <span class="mix-track">${segs(f.alloc,(f.aum/max*100))}</span>
      <span class="rank-val"><span class="v">${fmt(f.aum)}</span><span class="delta ${cls(f.mom)}">(${f.mom==null?'—':sign(f.mom)})</span></span>
    </div>`).join('');
  document.getElementById('mixList').innerHTML=html;
})();


/* ---- collapsible sections ---- */
document.querySelectorAll('.fold-body').forEach(fb=>{
  const sec = fb.closest('section');
  sec.classList.add('fold');
  const head = sec.querySelector('.sec-head');
  const chev = sec.querySelector('.chev');
  const toggle = ()=>{
    sec.classList.toggle('closed');
    chev.setAttribute('aria-expanded', String(!sec.classList.contains('closed')));
  };
  chev.setAttribute('aria-expanded','true');
  head.addEventListener('click', toggle);
});
</script>
</body>
</html>
